{% load static %}<!DOCTYPE html>
<html lang="en">

<head>
  {% block title %}<title>Project Tracking</title>{% endblock %}
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet"
        href="{% static 'assets/vendor/bootstrap/dist/css/bootstrap.min.css' %}">
  <link rel="stylesheet" href="{% static 'assets/css/volt.min.css' %}">
</head>

<body>
  {% block sidebar %}
    {% include "includes/sidebar.html" %}
  {% endblock %}

  <main class="content">
    <div class="container-fluid py-4">
      {% block content %}{% endblock %}

      {% block pagination %}
        {% include "includes/pagination.html" %}
      {% endblock %}
    </div>
  </main>

  <script
    src="{% static 'assets/vendor/bootstrap/dist/js/bootstrap.bundle.min.js' %}">
  </script>
  <script
    src="{% static 'assets/vendor/sweetalert2/dist/sweetalert2.all.min.js' %}">
  </script>
  <script src="{% static 'assets/js/volt.js' %}"></script>
</body>

</html>
