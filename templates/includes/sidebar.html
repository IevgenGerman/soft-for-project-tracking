<ul class="sidebar-nav list-group">
  {% if user.is_authenticated %}
    <li class="list-group-item">
      User: <a href="{{ user.get_absolute_url }}">{{ user.get_username }}</a>
    </li>
    <li class="list-group-item">
      <form method="post" action="{% url 'logout' %}" class="d-inline">
        {% csrf_token %}
        <button type="submit" class="btn btn-link p-0 m-0">
          Logout
        </button>
      </form>
    </li>
  {% else %}
    <li class="list-group-item">
      <a href="{% url 'login' %}?next={{ request.path }}">Login</a>
    </li>
  {% endif %}

  <br>

  <li class="list-group-item">
    <a href="{% url 'monitor:index' %}">Home</a>
  </li>
  <li class="list-group-item">
    <a href="{% url 'monitor:location-list' %}">Locations</a>
  </li>
  <li class="list-group-item">
    <a href="{% url 'monitor:team-list' %}">Teams</a>
  </li>
  <li class="list-group-item">
    <a href="{% url 'monitor:project-list' %}">Projects</a>
  </li>
  <li class="list-group-item">
    <a href="{% url 'monitor:teammember-list' %}">Team members</a>
  </li>
</ul>
