{% extends "base.html" %}

{% block content %}
  <h1>Delete team</h1>

  <p>Are you sure you want to delete "{{ team.name }}"?</p>

  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Delete</button>
    <a href="{% url 'monitor:team-list' %}" class="btn btn-secondary">
      Cancel
    </a>
  </form>
{% endblock %}
