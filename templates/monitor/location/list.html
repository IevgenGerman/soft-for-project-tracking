{% extends "base.html" %}

{% block content %}
  <h1>Locations</h1>

  <a href="{% url 'monitor:location-create' %}" class="btn btn-success mb-3">
    Add location
  </a>

  <table class="table table-striped">
    <thead>
      <tr>
        <th>Country</th>
        <th>City</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      {% for location in location_list %}
        <tr>
          <td>
            <a href="{% url 'monitor:location-detail' location.slug %}">
              {{ location.country }}
            </a>
          </td>
          <td>{{ location.city }}</td>
          <td>
            <a href="{% url 'monitor:location-update' location.slug %}"
               title="Update"
               class="btn btn-outline-secondary btn-sm">
              &#128295;
            </a>
            <a href="{% url 'monitor:location-delete' location.slug %}"
               title="Delete"
               class="btn btn-outline-danger btn-sm">
              &#10060;
            </a>
          </td>
        </tr>
      {% empty %}
        <tr>
          <td colspan="3">There are no locations yet.</td>
        </tr>
      {% endfor %}
    </tbody>
  </table>
{% endblock %}
